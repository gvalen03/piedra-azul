services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in the shell}
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      # Conserva usuarios, roles y clientes entre reinicios o recreaciones.
      - keycloak_data:/opt/keycloak/data
      # Solo se importa al crear por primera vez el realm piedra-azul.
      - ./keycloak/realm-piedra-azul.json:/opt/keycloak/data/import/realm-piedra-azul.json:ro

volumes:
  keycloak_data:
